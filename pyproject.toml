[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yipit-pipeline"
version = "1.0.0"
description = "Tech-news ARR pipeline: cleaning, warehouse model (DuckDB) and semantic search."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
yipit-pipeline = "yipit_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yipit_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not slow'"
markers = [
    "slow: loads the real sentence-transformers model (run with -m slow)",
]

[tool.coverage.run]
source = ["yipit_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
